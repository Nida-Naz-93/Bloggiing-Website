name: pr-validation-wf

on:
  pull_request:
    branches:
      - develop

jobs:
  build-job:
    name: Lint and Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          npm install --save-dev htmlhint stylelint parcel-bundler

      - name: Lint HTML Files
        run: npx htmlhint "**/*.html"

      - name: Lint CSS Files
        run: npx stylelint "**/*.css"

      - name: Build Website
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"

  linting-job:
    name: Linting Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install HTMLHint
        run: npm install --save-dev htmlhint

      - name: Install Stylelint
        run: npm install --save-dev stylelint

      - name: Lint HTML Files
        run: npx htmlhint "**/*.html"

      - name: Lint CSS Files
        run: npx stylelint "**/*.css"

      - name: Display package.json Contents
        run: cat package.json
